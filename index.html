<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷编程课堂记录与反馈</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>

            padding: 0;
            font-size: 14px;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            position: relative;
        }

        .img-top-right {
            position: absolute;
            top: 20px;
            right: 10px;
            width: 150px;
            height: auto;
            z-index: 1;
        }
        .img-top-left {
            position: absolute;
            top: 0px;
            left: 10px;
            width: 140px;
            height: auto;
            z-index: 1;
        }
        .img-bottom-right {
            position: absolute;
            bottom: 0px;
            right: 10px;
            width: 170px;
            height: auto;
            z-index: 1;
        }
        .img-bottom-left {
            position: absolute;
            bottom: 635px;
            left: 540px;
            width: 360px;
            height: auto;
            z-index: 1;
        }
        .img-bottom-left2 {
            position: absolute;
            bottom: 240px;
            left: 340px;
            width: 110px;
            height: auto;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #194b94;
            font-size: 42px;
        }
        .header p {
            color: #ff635b;
            margin-top: 6px;
            font-size: 16px;
        }

        .two-col-layout {
            display: flex;
            gap: 25px;
        }
        .col-left, .col-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .card.blue {
            background-color: #f0f5ff;
            border: 2px solid #4078c0;
        }
        .card.green {
            background-color: #f0fff0;
            border: 2px solid #6baa75;
        }
        .card.orange {
            background-color: #fff8e6;
            border: 2px solid #ffb347;

        .card.purple {
            background-color: #f8f0ff;
            border: 2px solid #9966cc;
        }
        .card h3 {
            margin-bottom: 6px;

            font-size: 15px;

        .form-row {
            margin-bottom: 10px;

        }

            align-items: center;
            justify-content: center;
            background: #f9f9f9;

        .img-wrapper {
            width: 100%;

            align-items: center;
            justify-content: center;
        }
        .upload-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
            transform-origin: center center;

        .crop-container {
            width:100%;
            height:100%;
            display:none;
            position:absolute;
            left:0;top:0;
            background:rgba(0,0,0,0.8);
            z-index:9999;
        }
        .crop-inner {
            width:95%;
            height:95%;
            margin: auto;
            position:relative;
        }
        .crop-close-tip {
            position:absolute;
            top:10px;
            left:50%;
            transform:translateX(-50%);
            color:#fff;
            background:rgba(255,255,255,0.2);
            padding:6px 12px;

            font-size:13px;

<script>
let cropperIns = null;
let currentPreviewId = "";
let currentCropBox = null;
let originImgSrc = "";

let scaleMap = {
    momentPreview: 1,
    workPreview: 1
};

// 统一裁剪完成关闭函数
function finishCropAndClose(){
    if(!cropperIns || !currentCropBox) return;
    const canvas = cropperIns.getCroppedCanvas({maxWidth:1920});
    const previewDom = document.getElementById(currentPreviewId);
    previewDom.src = canvas.toDataURL("image/png");
    previewDom.style.display = "block";
    currentCropBox.style.display = "none";
    cropperIns.destroy();
    cropperIns = null;
}

// 重置单张图片【修复点：同步清空file输入框】
function resetSingleImage(previewId, inputId){
    const img = document.getElementById(previewId);
    const fileInput = document.getElementById(inputId);
    // 清空文件选择记录，修复删除后无法上传bug
    fileInput.value = "";

    img.src = "";
    img.style.display = "none";
    img.style.transform = "scale(1)";
    scaleMap[previewId] = 1;

    // 关闭裁剪
    const cropBox = document.querySelector(`.crop-container[data-crop="${previewId.replace('Preview','')}"]`);
    if(cropBox) cropBox.style.display = "none";
    if(cropperIns && currentCropBox === cropBox){
        cropperIns.destroy();
        cropperIns = null;
    }
}

// 删除照片按钮 绑定data-input获取对应文件框
document.querySelectorAll('.del-img-btn').forEach(btn=>{
    btn.onclick = function(){
        const target = this.dataset.target;
        const inputId = this.dataset.input;
        const img = document.getElementById(target);
        if(img.style.display === 'none'){
            alert('暂无照片可删除！');
            return;
        }
        if(confirm('确定要删除这张照片吗？')){
            resetSingleImage(target, inputId);
        }
    }
})

// 重置缩放
function resetImageScale(imgId){
    scaleMap[imgId] = 1;
    const img = document.getElementById(imgId);
    img.style.transform = "scale(1)";
}

function initImageScale(imgId) {
    const img = document.getElementById(imgId);
    let scale = scaleMap[imgId];
    let touchStartDist = 0;

    function updateTransform() {
        img.style.transform = `scale(${scale})`;
        scaleMap[imgId] = scale;
    }
    img.onwheel = (e) => {
        e.preventDefault();
        scale = Math.max(0.2, Math.min(5, scale + (e.deltaY > 0 ? -0.05 : 0.05)));
        updateTransform();
    };
    img.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            touchStartDist = Math.hypot(dx, dy);
        }
    });
    img.addEventListener('touchmove', e => {
        e.preventDefault();
        if (e.touches.length === 2 && touchStartDist) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            scale = Math.max(0.2, Math.min(5, scale * (dist / touchStartDist)));
            touchStartDist = dist;
            updateTransform();
        }
    });
}

// 上传文件替换旧图
function handleFileUpload(inputId, previewId, cropBoxId){
    const fileInput = document.getElementById(inputId);
    const previewImg = document.getElementById(previewId);
    const cropBox = document.querySelector(`[data-crop="${cropBoxId}"]`);
    fileInput.onchange = function(e){
        const file = e.target.files[0];
        if(!file) return;

        if(cropperIns && currentCropBox === cropBox){
            cropperIns.destroy();
            cropperIns = null;
        }
        cropBox.style.display = "none";
        resetImageScale(previewId);

        const reader = new FileReader();
        reader.onload = function(ev){
            previewImg.src = ev.target.result;
            previewImg.style.display = "block";
        }
        reader.readAsDataURL(file);
    }
}
handleFileUpload("momentImg", "momentPreview", "moment");
handleFileUpload("workImg", "workPreview", "work");

// 打开裁剪
document.querySelectorAll('.crop-switch-btn').forEach(btn=>{
    btn.onclick = function(e){
        e.stopPropagation();
        currentPreviewId = this.dataset.target;
        const previewImg = document.getElementById(currentPreviewId);
        if(!previewImg.src || previewImg.style.display === "none"){
            alert("请先上传图片！");
            return;
        }
        originImgSrc = previewImg.src;
        const cropBoxId = currentPreviewId === "momentPreview" ? "cropImgMoment" : "cropImgWork";
        currentCropBox = this.closest(".upload-wrap").querySelector(".crop-container");
        const cropImgDom = document.getElementById(cropBoxId);
        cropImgDom.src = originImgSrc;
        currentCropBox.style.display = "block";
        if(cropperIns) cropperIns.destroy();
        cropperIns = new Cropper(cropImgDom, {
            viewMode:1,
            dragMode:"move",
            autoCropArea:0.8,
            responsive:true,
            restore:false,
            checkOrientation:false,
            cropBoxMovable:true,
            cropBoxResizable:true,
            toggleDragModeOnDblclick:true
        });

        const cropperWrap = cropperIns.container;
        cropperWrap.addEventListener('click', function(e){
            const targetClass = e.target.className;
            if(targetClass.includes('cropper-modal')){
                finishCropAndClose();
            }
        })
    }
});

// 兜底关闭
document.querySelectorAll('.crop-container').forEach(box=>{
    box.querySelector(".crop-close-tip").onclick = function(e){
        e.stopPropagation();
        finishCropAndClose();
    }
});

const abilityDesc = {
     "编程能力": "可以根据编程题目的要求，通过编程进行解题",
        "分析能力": "可以观察分析出题目中变量与变量关系",

};

let typeSel = document.getElementById("commentType");
let listSel = document.getElementById("commentList");
let msgArea = document.getElementById("teacherMsg");
let msgDisplay = document.getElementById("teacherMsgDisplay");

typeSel.onchange = function(){
    let k = this.value;
    listSel.innerHTML = '<option value="">先选择等级</option>';
    if(!k)return;
    commentLib[k].forEach(t=>{let o=document.createElement("option");o.value=t;o.innerText=t;listSel.appendChild(o);});
};
listSel.onchange = function(){
    if(this.value) {
        msgArea.value = this.value;
        msgDisplay.innerText = this.value;
    }
};

msgArea.oninput = function(){
    msgDisplay.innerText = this.value;
};

function renderSelect(selectEl){
    selectEl.innerHTML = "";
    abilityList.forEach(item => {
        let opt = document.createElement("option");
        opt.value = item;
        opt.innerText = item;
        selectEl.appendChild(opt);
    });
    let addOpt = document.createElement("option");
    addOpt.value = "+ 新建能力";
    addOpt.innerText = "+ 新建能力";
    selectEl.appendChild(addOpt);
}

const tableBody = document.getElementById("abilityTable");
for(let i=0;i<5;i++){
    let tr=document.createElement("tr");
    tr.innerHTML=`<td>
        <span class="ability-text" id="abilityText${i}">编程能力</span>
        <select class="ability-type-select" id="abilitySelect${i}"></select>
    </td>
    <td class="abilityDesc" id="descText${i}">请选择能力</td>
    <td>
        <span class="star-display" id="starText${i}">★★★☆☆</span>
        <input class="star-input" id="starInput${i}" type="number" value="3" min="1" max="5">
    </td>`;
    tableBody.appendChild(tr);
    renderSelect(document.getElementById(`abilitySelect${i}`));
}

document.querySelectorAll(".ability-type-select").forEach((s,i)=>{
    s.onchange=()=>{
        let v=s.value;
        document.getElementById(`abilityText${i}`).innerText = v;
        if(v=="+ 新建能力"){
            let n=prompt("输入能力名称");if(!n)return;
            let d=prompt("输入能力说明");if(!d)return;
            abilityList.push(n);
            abilityDesc[n] = d;
            document.querySelectorAll(".ability-type-select").forEach(sel => renderSelect(sel));
            s.value = n;
            document.getElementById(`abilityText${i}`).innerText = n;
            document.getElementById(`descText${i}`).innerText = d;
        }else{
            document.getElementById(`descText${i}`).innerText=abilityDesc[v]||"暂无说明";
        }
    };
});

document.querySelectorAll(".star-input").forEach((inp, idx) => {
    inp.onblur = function () {
        let val = this.value.trim();
        if (val === '') {
            this.value = 1;
        } else {
            let num = parseInt(val, 10);
            if (isNaN(num) || num < 1 || num > 5) {
                this.value = 1;
            }
        }
        let num = parseInt(this.value, 10);
        document.getElementById(`starText${idx}`).innerText = "★".repeat(num) + "☆".repeat(5 - num);
    };
});

function bindPro(inpId,barId){
    let inp=document.getElementById(inpId),bar=document.getElementById(barId);
    let txtSpan = document.querySelector(`.txt-percent[data-for="${inpId}"]`);
    inp.oninput=()=>{
        let v=Math.max(0,Math.min(100,parseInt(inp.value)||0));
        inp.value=v;
        bar.style.width=v+"%";
        txtSpan.textContent = v+"%";
    };
}
bindPro("bkPercent","bkBar");
bindPro("buildPercent","buildBar");
bindPro("codePercent","codeBar");

function clearAll(){
    document.querySelectorAll(".crop-container").forEach(c=>c.style.display="none");
    if(cropperIns){cropperIns.destroy();cropperIns=null;}

    resetSingleImage("momentPreview", "momentImg");
    resetSingleImage("workPreview", "workImg");

    document.querySelectorAll("input,textarea").forEach(x=>x.value="");
    msgDisplay.innerText = "";
    document.getElementById("classTime").value=new Date().toISOString().slice(0,16);
    document.getElementById("classScore").value=100;
    ["bkBar","buildBar","codeBar"].forEach(id=>document.getElementById(id).style.width="80%");
    ["bkPercent","buildPercent","codePercent"].forEach(id=>{
        document.getElementById(id).value=80;
        document.querySelector(`.txt-percent[data-for="${id}"]`).textContent="80%";
    });
    document.querySelectorAll(".ability-type-select").forEach((s,i)=>{
        s.selectedIndex=0;
        document.getElementById(`abilityText${i}`).innerText="编程能力";
        document.getElementById(`descText${i}`).innerText="请选择能力";
    });
    document.querySelectorAll(".star-input").forEach((inp,i)=>{
        inp.value=3;
        document.getElementById(`starText${i}`).innerText="★★★☆☆";
    });
    typeSel.selectedIndex=0;listSel.innerHTML='<option value="">先选择等级</option>';
}

async function generateReport(){
    document.querySelectorAll(".crop-container").forEach(c => c.style.display = "none");
    if(cropperIns) { cropperIns.destroy(); cropperIns = null; }

    const commentBox = document.getElementById("commentSelectBox");
    const scoreInput = document.getElementById("classScore");
    const starInputs = document.querySelectorAll(".star-input");
    const percentInputs = document.querySelectorAll(".progress-percent input");
    const percentTexts = document.querySelectorAll(".progress-percent .txt-percent");
    const abilitySelects = document.querySelectorAll(".ability-type-select");
    const abilityTexts = document.querySelectorAll(".ability-text");

    document.querySelectorAll(".del-img-btn").forEach(btn=>btn.style.display="none");
    document.querySelectorAll(".upload-btn-row").forEach(el=>el.style.display="none");

    commentBox.style.display = "none";
    msgArea.style.display = "none";
    msgDisplay.style.display = "block";
    msgDisplay.style.height = "auto";
    scoreInput.style.border = "none";
    scoreInput.style.background = "transparent";
    starInputs.forEach(el=>el.style.display="none");
    abilitySelects.forEach(el=>el.style.display="none");
    abilityTexts.forEach(el=>el.style.display="inline");
    percentInputs.forEach(el=>el.style.display="none");
    percentTexts.forEach(el=>el.style.display="inline-block");

    const container = document.getElementById('report-container');
    const fullHeight = Math.max(container.offsetHeight, container.scrollHeight);
    const canvas = await html2canvas(container, {
        scale:2,
        useCORS:true,
        logging:false,
        windowHeight: fullHeight,
        height: fullHeight,
        onclone: function(clonedDoc) {
            // 读取自定义属性色值，强制覆盖背景，百分百生效
            const uploadAreas = clonedDoc.querySelectorAll('.upload-area');
            uploadAreas.forEach(area => {
                const bgColor = area.dataset.cardBg;
                area.style.backgroundColor = bgColor;
            })
        }
    });
    const link = document.createElement('a');
    link.download = '课堂记录反馈.png';
    link.href = canvas.toDataURL('image/png');
    link.click();

    // 恢复界面
    document.querySelectorAll(".del-img-btn").forEach(btn=>btn.style.display="");
    document.querySelectorAll(".upload-btn-row").forEach(el=>el.style.display="flex");

    commentBox.style.display = "flex";
    msgArea.style.display = "block";
    msgDisplay.style.display = "none";
    scoreInput.style.border = "1px solid #ccc";
    scoreInput.style.background = "#fff";
    starInputs.forEach(el=>el.style.display="");
    abilitySelects.forEach(el=>el.style.display="");
    abilityTexts.forEach(el=>el.style.display="none");
    percentInputs.forEach(el=>el.style.display="");
    percentTexts.forEach(el=>el.style.display="none");

    alert('报告生成成功！');
}

initImageScale("momentPreview");
initImageScale("workPreview");
</script>
