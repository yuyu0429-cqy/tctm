<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷编程课堂记录与反馈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-size: 14px;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #ffffff;
            padding: 20px;
        }

        /* 页面最外层容器：所有内容都在这里 */
        .container {
            width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            position: relative;
        }

        /* 背景图片位置样式 */
        .img-top-right { position: absolute; top: 20px; right: 10px; width: 150px; z-index: 1; }
        .img-top-left { position: absolute; top: 0px; left: 10px; width: 140px; z-index: 1; }
        .img-bottom-right { position: absolute; bottom: 0px; right: 10px; width: 170px; z-index: 1; }
        .img-bottom-left { position: absolute; bottom: 635px; left: 540px; width: 360px; z-index: 1; }
        .img-bottom-left2 { position: absolute; bottom: 240px; left: 340px; width: 110px; z-index: 1; }

        /* 标题样式 */
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #194b94; font-size: 42px; }
        .header p { color: #ff635; margin-top: 6px; font-size: 16px; }

        /* 左右两栏布局 */
        .two-col-layout { display: flex; gap: 25px; }
        .col-left, .col-right { flex: 1; display: flex; flex-direction: column; gap: 20px; }

        /* 卡片公共样式 */
        .card { border-radius: 12px; padding: 10px; width: 100%; display: flex; flex-direction: column; }
        .card.blue { background-color: #f0f5ff; border: 2px solid #4078c0; }
        .card.green { background-color: #f0fff0; border: 2px solid #6baa75; }
        .card.orange { background-color: #fff8e6; border: 2px solid #ffb347; }
        .card.purple { background-color: #f8f0ff; border: 2px solid #9966cc; }
        .card h3 { margin-bottom: 10px; color: #9966cc; font-size: 15px; }

        /* 表单项样式 */
        .form-row { margin-bottom: 10px; font-size: 16px; }
        .form-row input { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px; }

        /* 评语下拉框样式 */
        .comment-select-row{ display:flex; gap:10px; margin-bottom:10px; }
        .comment-select-row select{ flex:1; }

        /* 能力表格样式 */
        .ability-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #86d17b; border-radius: 8px; overflow: hidden; }
        .ability-table th, .ability-table td { border: 1px solid #86d17b; padding: 8px 6px; font-size: 13px; text-align: center; background: #fff; }
        .ability-table th { background: #e6f4e0; font-weight: bold; font-size: 14px; }
        .ability-table th:nth-child(1),.ability-table td:nth-child(1) {width: 35%;}
        .ability-table th:nth-child(2),.ability-table td:nth-child(2) {width: 45%;}
        .ability-table th:nth-child(3),.ability-table td:nth-child(3) {width: 20%;}

        /* 能力选择、星级样式 */
        .ability-text {display: none;}
        .ability-type-select {width: 100%; padding: 2px; border: 1px solid #ccc; border-radius: 3px;}
        .star-display {color: #ffcc00; font-size: 14px;}
        .star-input {width: 35px; text-align: center; border: 1px solid #ccc; border-radius: 3px;}

        /* 图片上传区域样式 */
        .upload-area { flex:1; position: relative; width:100%; display: flex; align-items: center; justify-content: center; min-height:200px; }
        .upload-area input[type="file"] {display: none;}
        .upload-btn { padding:6px 12px; background:#4299e1; color:white; border-radius:4px; cursor:pointer; font-size:14px; z-index:2; }
        .upload-image { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(1); max-width:90%; max-height:85%; object-fit:contain; display:none; }

        /* 进度条样式 */
        .progress-row { display:flex; align-items:center; margin-bottom:10px; font-size:14px; }
        .progress-row label {width:120px;}
        .progress-bar-container { flex:1; height:18px; background:#eee; border-radius:2px; overflow:hidden; margin:0 8px; }
        .progress-bar-fill {height:100%; background:#4299e1;}
        .progress-percent {position:relative;}
        .progress-percent input {width:50px; padding:2px; text-align:right;}
        .progress-percent .txt-percent { position:absolute; right:4px; top:50%; transform:translateY(-50%); pointer-events:none; display:none; }

        /* 底部文字与按钮 */
        .full-card-wrap {margin-top:25px;}
        .full-card {width:100%;}
        .footer-text {text-align:center; margin-top:20px; font-size:14px; color:#4078c0;}
        .btn-group {text-align:center; margin-top:25px;}
        .btn {padding:8px 18px; background:#367be8; color:#fff; border:none; border-radius:4px; cursor:pointer; margin:0 6px;}
    </style>
</head>

<body>
<div class="container" id="report-container">

    <!-- 背景装饰图片 -->
    <img class="img-top-right" src="图片1.png">
    <img class="img-top-left" src="电脑.png">
    <img class="img-bottom-right" src="jq.png">
    <img class="img-bottom-left" src="jj.png">
    <img class="img-bottom-left2" src="xp.png">

    <!-- 标题区域 -->
    <div class="header">
        <h1>酷编程课堂记录与反馈</h1>
        <p>记录成长每一步 · 见证进步每一天</p>
    </div>

    <!-- 左右两栏布局开始 -->
    <div class="two-col-layout">

        <!-- ====================================== -->
        <!-- 左侧栏（左半边屏幕）一共 4 个卡片 -->
        <!-- ====================================== -->
        <div class="col-left">

            <!-- ============== 卡片 1 ============== -->
            <!-- ① 学生基本信息卡片 -->
            <!-- 位置：左侧最顶部 -->
            <!-- ==================================== -->
            <div class="card blue" style="height:300px">
                <h3>① 学生基本信息</h3>
                <div class="form-row"><label>学生姓名：</label><input type="text" id="stuName"></div>
                <div class="form-row"><label>课程名称：</label><input type="text" id="courseName"></div>
                <div class="form-row"><label>上课时间：</label><input type="datetime-local" id="classTime"></div>
                <div class="form-row"><label>教师姓名：</label><input type="text" id="teaName"></div>
            </div>

            <!-- ============== 卡片 2 ============== -->
            <!-- ② 本节课学习内容卡片 -->
            <!-- 位置：左侧第二个 -->
            <!-- ==================================== -->
            <div class="card blue" style="height:270px">
                <h3>② 本节课学习内容</h3>
                <div class="form-row"><label>搭建主题：</label><input type="text" id="buildTheme"></div>
                <div class="form-row"><label>核心知识点：</label><input type="text" id="coreKnow"></div>
                <div class="form-row"><label>认知目标：</label><input type="text" id="cogTarget"></div>
            </div>

            <!-- ============== 卡片 3 ============== -->
            <!-- ③ 学习目标达成情况（表格卡片） -->
            <!-- 位置：左侧第三个 -->
            <!-- ==================================== -->
            <div class="card green" style="height:360px">
                <h3>③ 学习目标达成情况</h3>
                <table class="ability-table">
                    <thead><tr><th>能力类型</th><th>分析解释</th><th>达成星数</th></tr></thead>
                    <tbody id="abilityTable"></tbody>
                </table>
            </div>

            <!-- ============== 卡片 4 ============== -->
            <!-- ④ 课堂练习完成分数卡片 -->
            <!-- 位置：左侧最底部 -->
            <!-- ==================================== -->
            <div class="card blue" style="height:110px">
                <h3>④ 课堂练习完成分数</h3>
                <div class="form-row"><label>本节课得分：</label><input type="number" id="classScore" value="100" min="0" max="100"></div>
            </div>

        </div>

        <!-- ====================================== -->
        <!-- 右侧栏（右半边屏幕）一共 3 个卡片 -->
        <!-- ====================================== -->
        <div class="col-right">

            <!-- ============== 卡片 5 ============== -->
            <!-- ⑤ 本节课专注学习瞬间（照片上传） -->
            <!-- 位置：右侧最顶部 -->
            <!-- ==================================== -->
            <div class="card orange" style="height:460px">
                <h3>⑤ 本节课专注学习瞬间</h3>
                <div class="upload-area">
                    <input type="file" id="momentImg">
                    <label class="upload-btn" for="momentImg">上传照片</label>
                    <img class="upload-image" id="momentPreview">
                </div>
            </div>

            <!-- ============== 卡片 6 ============== -->
            <!-- ⑥ 课堂表现评估（进度条卡片） -->
            <!-- 位置：右侧第二个 -->
            <!-- ==================================== -->
            <div class="card purple" style="height:250px">
                <h3>⑥ 课堂表现评估</h3>
                <div class="progress-row">
                    <label>百科知识理解：</label>
                    <div class="progress-bar-container"><div class="progress-bar-fill" id="bkBar" style="width:80%"></div></div>
                    <div class="progress-percent">
                        <input type="number" id="bkPercent" value="80">
                        <span class="txt-percent" data-for="bkPercent">80%</span>
                    </div>
                </div>
                <div class="progress-row">
                    <label>搭建独立完成度：</label>
                    <div class="progress-bar-container"><div class="progress-bar-fill" id="buildBar" style="width:80%"></div></div>
                    <div class="progress-percent">
                        <input type="number" id="buildPercent" value="80">
                        <span class="txt-percent" data-for="buildPercent">80%</span>
                    </div>
                </div>
                <div class="progress-row">
                    <label>编程独立完成度：</label>
                    <div class="progress-bar-container"><div class="progress-bar-fill" id="codeBar" style="width:80%"></div></div>
                    <div class="progress-percent">
                        <input type="number" id="codePercent" value="80">
                        <span class="txt-percent" data-for="codePercent">80%</span>
                    </div>
                </div>
            </div>

            <!-- ============== 卡片 7 ============== -->
            <!-- ⑦ 作品展示（作品照片上传） -->
            <!-- 位置：右侧最底部 -->
            <!-- ==================================== -->
            <div class="card orange" style="height:350px">
                <h3>⑦ 作品展示</h3>
                <div class="upload-area">
                    <input type="file" id="workImg">
                    <label class="upload-btn" for="workImg">上传作品</label>
                    <img class="upload-image" id="workPreview">
                </div>
            </div>

        </div>
    </div>

    <!-- ====================================== -->
    <!-- 底部通栏卡片（横跨整个屏幕） -->
    <!-- ====================================== -->

    <!-- ============== 卡片 8 ============== -->
    <!-- ⑧ 教师寄语（评语+文本框） -->
    <!-- 位置：页面最底部、全屏宽度 -->
    <!-- ==================================== -->
    <div class="full-card-wrap">
        <div class="card purple full-card" style="height:160px">
            <h3>⑧ 教师寄语：</h3>
            <div class="comment-select-row" id="commentSelectBox">
                <select id="commentType">
                    <option value="">选择评语等级</option>
                    <option value="excellent">优秀表现</option>
                    <option value="normal">中等平稳</option>
                    <option value="weak">有待提升</option>
                </select>
                <select id="commentList"><option value="">先选择等级</option></select>
            </div>
            <textarea id="teacherMsg" rows="3" style="width:100%;border:1px solid #ccc;border-radius:4px;padding:5px"></textarea>
        </div>
    </div>

    <!-- 页面底部文字 -->
    <div class="footer-text">感谢信任支持，陪伴孩子快乐成长</div>
</div>

<!-- 功能按钮 -->
<div class="btn-group">
    <button class="btn" onclick="generateReport()">生成图片报告</button>
    <button class="btn" onclick="clearAll()">清空表单</button>
</div>

<!-- JS 功能代码（省略，不影响布局） -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
//JS代码部分保留原样
</script>
</body>
</html>
